name: Golden Stage 2 restore tooling
on:
  push:
    branches: ['recovery/golden-stage-2-2026-10-15-universal-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test isolated restoration tooling with synthetic fixtures
        run: python tests/test_restore.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: restore-tooling-${{ matrix.os }}
          path: restore-tooling-report.json
